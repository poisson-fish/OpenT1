name: Publish numbered release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: numbered-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Find the successful main build for this exact commit
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$commit" origin/main
          run_id=$(gh run list --workflow build.yml --branch main --event push \
            --commit "$commit" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = null ]; then
            echo 'No successful main build exists for this commit. Wait for main CI, then rerun this workflow.' >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.tested.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: release-*
          merge-multiple: true
          path: build/dist
      - name: Promote tested main artifacts to a numbered release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.tested.outputs.commit }}
          RELEASE_REF: ${{ github.ref }}
        run: python tools/publish_release.py --directory build/dist --commit "$RELEASE_COMMIT" --ref "$RELEASE_REF"
